<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>JARVIS — So'zlar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #05090e; --bg2: #101b28; --line: #20344a;
    --accent: #4ae8ff; --accent2: #2563eb;
    --text: #e6f1f8; --muted: #7d94a8;
    --ok: #22c55e; --no: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at 50% 15%, var(--bg2), var(--bg) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; padding: 14px; }

  header { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; }
  .logo {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, #101b28, #05090e);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    font-weight: 700; color: var(--accent); font-size: 17px;
  }
  .title { font-size: 14px; font-weight: 600; }
  .sub { font-size: 11px; color: var(--muted); }
  #counter { margin-left: auto; font-size: 13px; color: var(--muted); }

  #bar { height: 3px; background: #16232f; border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .3s; }

  #stage { flex: 1; display: grid; place-items: center; padding: 6px 0; }

  .card {
    width: 100%; max-width: 420px; min-height: 240px;
    background: linear-gradient(160deg, #0e1a26, #0a131c);
    border: 1px solid var(--line); border-radius: 20px;
    padding: 26px 22px; cursor: pointer;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; gap: 14px;
    transition: transform .18s ease, opacity .18s ease;
  }
  .card:active { transform: scale(.985); }
  .card.flip { animation: flip .28s ease; }
  @keyframes flip { 0% { transform: rotateX(0) } 50% { transform: rotateX(90deg); opacity: .3 } 100% { transform: rotateX(0) } }

  .word { font-size: 30px; font-weight: 700; letter-spacing: .3px; line-height: 1.2; }
  .meaning { font-size: 22px; color: var(--accent); font-weight: 600; }
  .example { font-size: 14px; color: var(--muted); font-style: italic; line-height: 1.5; }
  .tap { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .badge {
    font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px;
  }

  #speaker {
    position: absolute; top: 14px; right: 14px;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--line); background: #0e1a26;
    color: var(--accent); font-size: 17px; cursor: pointer;
    display: grid; place-items: center;
  }
  #speaker:disabled { opacity: .4; }
  .cardwrap { position: relative; width: 100%; max-width: 420px; }

  footer { display: flex; gap: 10px; padding-top: 12px; }
  .btn {
    flex: 1; padding: 16px; border-radius: 14px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer; color: #fff;
  }
  .btn:active { transform: scale(.97); }
  .btn.no { background: linear-gradient(135deg, #ef4444, #b91c1c); }
  .btn.ok { background: linear-gradient(135deg, #22c55e, #15803d); }
  .btn:disabled { opacity: .35; }

  .center { text-align: center; color: var(--muted); font-size: 14px; line-height: 1.7; padding: 0 20px; }
  .big { font-size: 42px; margin-bottom: 8px; }
  #status { text-align: center; font-size: 12px; color: var(--muted); height: 15px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">J</div>
    <div>
      <div class="title">So'z kartochkalari</div>
      <div class="sub" id="mode">yuklanyapti…</div>
    </div>
    <div id="counter"></div>
  </header>

  <div id="bar"><div id="fill"></div></div>

  <div id="stage">
    <div class="center" id="loading">
      <div class="big">📔</div>
      So'zlar yuklanyapti…
    </div>
  </div>

  <div id="status"></div>

  <footer id="controls" style="display:none">
    <button class="btn no" id="btnNo">Bilmadim</button>
    <button class="btn ok" id="btnOk">Bildim</button>
  </footer>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const API = 'https://xumoai-agent.onrender.com';
const APP_KEY = new URLSearchParams(location.search).get('k') || '';

const stage = document.getElementById('stage');
const loading = document.getElementById('loading');
const controls = document.getElementById('controls');
const btnOk = document.getElementById('btnOk');
const btnNo = document.getElementById('btnNo');
const counter = document.getElementById('counter');
const modeEl = document.getElementById('mode');
const fill = document.getElementById('fill');
const status = document.getElementById('status');

let cards = [], idx = 0, flipped = false, known = 0, unknown = 0, audioCache = {};

function haptic(t) { try { tg?.HapticFeedback?.impactOccurred(t); } catch {} }
function setStatus(t) { status.textContent = t || ''; }

async function post(path, data = {}) {
  const res = await fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...data, initData: tg?.initData || '', key: APP_KEY }),
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
  return j;
}

// ==================== YUKLASH ====================
async function load() {
  try {
    const r = await post('/api/cards');
    cards = r.cards || [];
    modeEl.textContent = r.mode === 'kunlik' ? 'bugungi takror' : 'eng zaif so\'zlar';

    if (!cards.length) {
      loading.innerHTML = '<div class="big">✅</div>Takrorlanadigan so\'z yo\'q.<br>Botda /word new yuboring.';
      return;
    }
    render();
  } catch (e) {
    loading.innerHTML = '<div class="big">⚠️</div>' + e.message;
  }
}

// ==================== KO'RSATISH ====================
function render() {
  const c = cards[idx];
  if (!c) return finish();

  flipped = false;
  counter.textContent = `${idx + 1} / ${cards.length}`;
  fill.style.width = ((idx / cards.length) * 100) + '%';

  stage.innerHTML = `
    <div class="cardwrap">
      <button id="speaker">🔊</button>
      <div class="card" id="card">
        <div class="badge">quti ${c.box || 1}</div>
        <div class="word">${esc(c.word)}</div>
        <div class="tap">tarjimani ko'rish uchun bosing</div>
      </div>
    </div>`;

  controls.style.display = 'flex';
  btnOk.disabled = btnNo.disabled = true;

  document.getElementById('card').onclick = flip;
  document.getElementById('speaker').onclick = (e) => { e.stopPropagation(); play(c.word); };
}

function flip() {
  if (flipped) return;
  flipped = true;
  haptic('light');

  const c = cards[idx];
  const card = document.getElementById('card');
  card.classList.add('flip');

  setTimeout(() => {
    card.innerHTML =
      `<div class="badge">quti ${c.box || 1}</div>` +
      `<div class="word">${esc(c.word)}</div>` +
      `<div class="meaning">${esc(c.meaning || '')}</div>` +
      (c.example ? `<div class="example">${esc(c.example)}</div>` : '');
    btnOk.disabled = btnNo.disabled = false;
  }, 140);
}

function esc(s) {
  return String(s || '').replace(/[<>&]/g, (m) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[m]));
}

// ==================== JAVOB ====================
async function answer(isKnown) {
  if (!flipped) return;
  const c = cards[idx];

  isKnown ? known++ : unknown++;
  haptic(isKnown ? 'light' : 'medium');

  btnOk.disabled = btnNo.disabled = true;
  idx++;
  render();

  // Natijani fonda yuboramiz — kutib turmaymiz
  post('/api/card', { id: c.id, known: isKnown }).catch(() => {});
}

btnOk.onclick = () => answer(true);
btnNo.onclick = () => answer(false);

// ==================== TALAFFUZ ====================
async function play(word) {
  const btn = document.getElementById('speaker');

  if (audioCache[word]) {
    new Audio('data:audio/mpeg;base64,' + audioCache[word]).play().catch(() => {});
    return;
  }

  btn.disabled = true;
  setStatus('🔊 tayyorlanyapti…');
  try {
    const r = await post('/api/word-audio', { word });
    if (r.audio) {
      audioCache[word] = r.audio;
      new Audio('data:audio/mpeg;base64,' + r.audio).play().catch(() => {});
    }
    setStatus('');
  } catch (e) {
    setStatus('ovoz kelmadi');
  } finally {
    btn.disabled = false;
  }
}

// ==================== YAKUN ====================
function finish() {
  fill.style.width = '100%';
  counter.textContent = '';
  controls.style.display = 'none';

  const total = known + unknown;
  const pct = total ? Math.round((known / total) * 100) : 0;

  stage.innerHTML = `
    <div class="center">
      <div class="big">${pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '💪'}</div>
      <div style="font-size:26px;color:var(--text);font-weight:700;margin-bottom:10px">${known} / ${total}</div>
      <div>Bildim: ${known} · Bilmadim: ${unknown}</div>
      <div style="margin-top:14px;font-size:13px">
        ${unknown ? `${unknown} ta so'z ertaga qaytadi.` : 'Hammasi to\'g\'ri — zo\'r!'}
      </div>
    </div>`;

  haptic('heavy');
  try { tg?.HapticFeedback?.notificationOccurred(pct >= 80 ? 'success' : 'warning'); } catch {}
}

// Serverni oldindan uyg'otamiz
fetch(API + '/api/health').catch(() => {});
load();
</script>
</body>
</html>
