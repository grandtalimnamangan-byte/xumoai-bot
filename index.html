<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>JARVIS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #05090e;
    --bg2: #101b28;
    --line: #20344a;
    --accent: #4ae8ff;
    --accent2: #2563eb;
    --text: #e6f1f8;
    --muted: #7d94a8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at 50% 20%, var(--bg2), var(--bg) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; padding: 16px; }

  header { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, #101b28, #05090e);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    font-weight: 700; color: var(--accent); font-size: 18px;
  }
  .title { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
  .sub { font-size: 11px; color: var(--muted); }

  #log {
    flex: 1; overflow-y: auto; padding: 4px 2px 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 88%; padding: 10px 13px; border-radius: 14px;
    font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
  }
  .me {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent2), #1e40af);
    color: #fff; border-bottom-right-radius: 4px;
  }
  .ai {
    align-self: flex-start;
    background: #0e1a26; border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }
  .sys { align-self: center; font-size: 12px; color: var(--muted); }

  .empty {
    margin: auto; text-align: center; color: var(--muted);
    font-size: 13px; line-height: 1.6; padding: 0 24px;
  }

  footer { padding-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }

  #status { font-size: 12px; color: var(--muted); height: 16px; }

  #mic {
    width: 92px; height: 92px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #04121a; font-size: 34px;
    display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 0 0 0 rgba(74,232,255,.45);
    transition: transform .12s ease, box-shadow .3s ease;
    user-select: none;
  }
  #mic:active { transform: scale(.94); }
  #mic.rec {
    background: linear-gradient(135deg, #ff5f6d, #c0392b);
    animation: pulse 1.3s infinite;
  }
  #mic.busy { opacity: .5; pointer-events: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,95,109,.5); }
    70% { box-shadow: 0 0 0 22px rgba(255,95,109,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,95,109,0); }
  }

  .row { display: flex; gap: 8px; width: 100%; }
  #inp {
    flex: 1; padding: 11px 14px; border-radius: 12px;
    background: #0e1a26; border: 1px solid var(--line);
    color: var(--text); font-size: 14px; outline: none;
  }
  #send {
    padding: 0 16px; border-radius: 12px; border: 1px solid var(--line);
    background: #0e1a26; color: var(--accent); font-size: 15px; cursor: pointer;
  }
  .hint { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">J</div>
    <div>
      <div class="title">JARVIS</div>
      <div class="sub" id="sub">ovozli suhbat</div>
    </div>
  </header>

  <div id="log">
    <div class="empty" id="empty">
      Mikrofonni bosib ushlab turing va gapiring.<br>
      Qo'yib yuborsangiz javob beraman.
    </div>
  </div>

  <footer>
    <div id="status"></div>
    <button id="mic">🎙</button>
    <div class="row">
      <input id="inp" placeholder="yoki yozing…" autocomplete="off">
      <button id="send">➤</button>
    </div>
    <div class="hint">Ovoz javobi avtomatik ijro etiladi</div>
  </footer>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// Server manzili — Mini App shu yerga murojaat qiladi
const API = 'https://xumoai-agent.onrender.com';

const log = document.getElementById('log');
const empty = document.getElementById('empty');
const mic = document.getElementById('mic');
const status = document.getElementById('status');
const inp = document.getElementById('inp');
const send = document.getElementById('send');

function say(text, who) {
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function setStatus(t) { status.textContent = t || ''; }
function busy(on) { mic.classList.toggle('busy', on); send.disabled = on; }

// ==================== OVOZ YOZIB OLISH ====================
let audioCtx, stream, source, processor, buffers = [], recording = false, sampleRate = 16000;

async function startRec() {
  if (recording) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
  } catch (e) {
    setStatus('Mikrofonga ruxsat berilmadi');
    return;
  }

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  source = audioCtx.createMediaStreamSource(stream);
  processor = audioCtx.createScriptProcessor(4096, 1, 1);
  buffers = [];
  sampleRate = audioCtx.sampleRate;

  processor.onaudioprocess = (e) => {
    if (!recording) return;
    buffers.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  };

  source.connect(processor);
  processor.connect(audioCtx.destination);
  recording = true;
  mic.classList.add('rec');
  setStatus('Tinglayapman…');
  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
}

async function stopRec() {
  if (!recording) return;
  recording = false;
  mic.classList.remove('rec');

  try { processor.disconnect(); source.disconnect(); } catch {}
  try { stream.getTracks().forEach((t) => t.stop()); } catch {}
  try { await audioCtx.close(); } catch {}

  const total = buffers.reduce((a, b) => a + b.length, 0);
  if (total < sampleRate * 0.4) { setStatus('Juda qisqa'); return; }

  const merged = new Float32Array(total);
  let off = 0;
  for (const b of buffers) { merged.set(b, off); off += b.length; }

  const down = downsample(merged, sampleRate, 16000);
  const wav = encodeWav(down, 16000);

  setStatus('Yuborilyapti…');
  busy(true);
  say('🎙 ovozli xabar', 'me');

  try {
    const r = await post('/api/voice', { audio: toBase64(wav), mime: 'audio/wav' });
    busy(false);
    await handleAnswer(r);
  } catch (e) {
    setStatus('Xato: ' + e.message);
  } finally {
    busy(false);
  }
}

function downsample(buf, from, to) {
  if (to >= from) return buf;
  const ratio = from / to;
  const out = new Float32Array(Math.round(buf.length / ratio));
  let oi = 0, i = 0;
  while (oi < out.length) {
    const next = Math.round((oi + 1) * ratio);
    let sum = 0, n = 0;
    for (; i < next && i < buf.length; i++) { sum += buf[i]; n++; }
    out[oi++] = n ? sum / n : 0;
  }
  return out;
}

function encodeWav(samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };

  w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); w(8, 'WAVE');
  w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, samples.length * 2, true);

  let o = 44;
  for (let i = 0; i < samples.length; i++, o += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Uint8Array(buf);
}

function toBase64(bytes) {
  let s = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(s);
}

// ==================== SERVER BILAN ALOQA ====================
// Havoladagi maxfiy kalit — Telegram imzosi ishlamagan holatlar uchun
const APP_KEY = new URLSearchParams(location.search).get('k') || '';

async function post(path, data) {
  const res = await fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...data, initData: tg?.initData || '', key: APP_KEY }),
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
  return j;
}

let player = null;

// Formatlash belgilarini tozalash — ekranda ** ko'rinmasligi uchun
function clean(t) {
  return (t || '')
    .replace(/```[\s\S]*?```/g, '')
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/\*(.+?)\*/g, '$1')
    .replace(/^#{1,6}\s*/gm, '')
    .replace(/`/g, '')
    .trim();
}

async function handleAnswer(r) {
  const text = clean(r.text) || '(bo\'sh)';
  say(text, 'ai');
  setStatus('🔊 ovoz tayyorlanyapti…');

  // Ovoz alohida so'raladi — matn kutib turmaydi
  try {
    const a = await post('/api/speak', { text: r.text });
    if (a.audio) {
      if (player) { player.pause(); player = null; }
      player = new Audio('data:audio/mpeg;base64,' + a.audio);
      player.play().catch(() => setStatus('Ovozni ijro etib bo\'lmadi'));
      setStatus('');
    } else {
      setStatus('');
    }
  } catch {
    setStatus('');
  }
}

// ==================== TUGMALAR ====================
mic.addEventListener('mousedown', startRec);
mic.addEventListener('mouseup', stopRec);
mic.addEventListener('mouseleave', () => { if (recording) stopRec(); });
mic.addEventListener('touchstart', (e) => { e.preventDefault(); startRec(); }, { passive: false });
mic.addEventListener('touchend', (e) => { e.preventDefault(); stopRec(); }, { passive: false });

async function sendText() {
  const t = inp.value.trim();
  if (!t) return;
  inp.value = '';
  say(t, 'me');
  busy(true);
  setStatus('O\'ylayapman…');
  try {
    const r = await post('/api/text', { text: t });
    busy(false);
    await handleAnswer(r);
  } catch (e) {
    setStatus('Xato: ' + e.message);
  } finally {
    busy(false);
  }
}

send.addEventListener('click', sendText);
inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendText(); });

// Server uyquda bo'lsa oldindan uyg'otamiz
fetch(API + '/api/health').catch(() => {});
</script>
</body>
</html>
